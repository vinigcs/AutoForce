<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Funcionário | AutoForce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>AutoForce</h1>
        <p>Editar informações do funcionário</p>
    </header>

    <main>
        <h2>Editar Funcionário</h2>

        <form action="{{ url_for('editar_funcionario', id=funcionario.id) }}" method="POST">

            <label>Nome:</label><br>
            <input type="text" name="nome"
                   value="{{ funcionario.nome }}" required><br><br>

            <label>Cargo:</label><br>
            <input type="text" name="cargo"
                   value="{{ funcionario.cargo }}" required><br><br>

            <label>Telefone:</label><br>
            <input type="text" name="telefone"
                   value="{{ funcionario.telefone or '' }}"><br><br>

            <button type="submit">Salvar Alterações</button>

        </form>

        <br>
        <a href="{{ url_for('funcionarios') }}">Cancelar e voltar</a>

    </main>

</body>
</html>
