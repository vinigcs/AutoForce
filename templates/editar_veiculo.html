<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Veículo | AutoForce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>AutoForce</h1>
        <p>Editar informações do veículo</p>
    </header>

    <main>
        <h2>Editar Veículo</h2>

        <form action="{{ url_for('editar_veiculo', id=veiculo.id) }}" method="POST">

            <label>Proprietário:</label><br>
            <select name="cliente_id" required>
                {% for cliente in clientes %}
                    <option value="{{ cliente.id }}"
                        {% if cliente.id == veiculo.cliente_id %}selected{% endif %}>
                        {{ cliente.nome }}
                    </option>
                {% endfor %}
            </select><br><br>

            <label>Placa:</label><br>
            <input type="text" name="placa" value="{{ veiculo.placa }}" required><br><br>

            <label>Marca:</label><br>
            <input type="text" name="marca" value="{{ veiculo.marca }}" required><br><br>

            <label>Modelo:</label><br>
            <input type="text" name="modelo" value="{{ veiculo.modelo }}" required><br><br>

            <label>Ano:</label><br>
            <input type="number" name="ano" min="1900" max="2100"
                   value="{{ veiculo.ano or '' }}"><br><br>

            <label>Tipo de veículo:</label><br>
            <select name="tipo" required>
                <option value="Carro"
                    {% if veiculo.tipo == 'Carro' %}selected{% endif %}>
                    Carro
                </option>

                <option value="Motocicleta"
                    {% if veiculo.tipo == 'Motocicleta' %}selected{% endif %}>
                    Motocicleta
                </option>
            </select><br><br>

            <button type="submit">Salvar Alterações</button>

        </form>

        <br>
        <a href="{{ url_for('veiculos') }}">Cancelar e voltar</a>

    </main>

</body>
</html>
