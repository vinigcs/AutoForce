<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Peça | AutoForce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>AutoForce</h1>
        <p>Editar informações da peça</p>
    </header>

    <main>
        <h2>Editar Peça</h2>

        <form action="{{ url_for('editar_peca', id=peca.id) }}" method="POST">

            <label>Nome da peça:</label><br>
            <input type="text" name="nome" value="{{ peca.nome }}" required><br><br>

            <label>Marca:</label><br>
            <input type="text" name="marca" value="{{ peca.marca or '' }}"><br><br>

            <label>Preço unitário (R$):</label><br>
            <input type="number" name="preco" min="0" step="0.01"
                   value="{{ peca.preco }}" required><br><br>

            <p>Quantidade atual em estoque: {{ peca.quantidade }}</p>
            <p>A quantidade deve ser alterada pela tela de movimentação de estoque.</p>

            <button type="submit">Salvar Alterações</button>

        </form>

        <br>
        <a href="{{ url_for('pecas') }}">Cancelar e voltar</a>

    </main>

</body>
</html>
