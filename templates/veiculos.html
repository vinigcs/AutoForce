<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos | AutoForce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>AutoForce</h1>
    <p>Gestão de Veículos</p>
</header>

<main>
    <h2 id="tituloFormulario">Cadastrar Veículo</h2>
    <p>Cadastre carros e motocicletas vinculados aos seus proprietários.</p>

    <form id="formVeiculo">

        <label>Proprietário:</label><br>
        <select id="cliente_id" required>
            <option value="">Selecione um cliente</option>
            {% for cliente in clientes %}
                <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
            {% endfor %}
        </select><br><br>

        <label>Placa:</label><br>
        <input type="text" id="placa" placeholder="ABC1D23" required><br><br>

        <label>Marca:</label><br>
        <input type="text" id="marca" required><br><br>

        <label>Modelo:</label><br>
        <input type="text" id="modelo" required><br><br>

        <label>Ano:</label><br>
        <input type="number" id="ano" min="1900" max="2100"><br><br>

        <label>Tipo de veículo:</label><br>
        <select id="tipo" required>
            <option value="">Selecione</option>
            <option value="Carro">Carro</option>
            <option value="Motocicleta">Motocicleta</option>
        </select><br><br>

        <button type="submit" id="botaoSalvar">Cadastrar Veículo</button>
        <button type="button" id="botaoCancelar" hidden>Cancelar edição</button>
    </form>

    <p id="mensagem" role="status"></p>

    <hr>

    <h2>Veículos cadastrados</h2>

    <div id="listaVeiculos">
        <p>Carregando veículos...</p>
    </div>

    <br>
    <a href="/">Voltar ao início</a>
</main>

<script>
const API_URL = "http://127.0.0.1:5001/api/veiculos";

const formulario = document.getElementById("formVeiculo");
const lista = document.getElementById("listaVeiculos");
const mensagem = document.getElementById("mensagem");
const tituloFormulario = document.getElementById("tituloFormulario");
const botaoSalvar = document.getElementById("botaoSalvar");
const botaoCancelar = document.getElementById("botaoCancelar");

let veiculoEmEdicao = null;

function mostrarMensagem(texto) {
    mensagem.textContent = texto;
}

function limparFormulario() {
    formulario.reset();
    veiculoEmEdicao = null;

    tituloFormulario.textContent = "Cadastrar Veículo";
    botaoSalvar.textContent = "Cadastrar Veículo";
    botaoCancelar.hidden = true;
}

async function carregarVeiculos() {
    lista.textContent = "Carregando veículos...";

    try {
        const resposta = await fetch(API_URL);

        if (!resposta.ok) {
            throw new Error("Não foi possível consultar os veículos.");
        }

        const veiculos = await resposta.json();
        lista.replaceChildren();

        if (veiculos.length === 0) {
            lista.textContent = "Nenhum veículo cadastrado.";
            return;
        }

        veiculos.forEach(veiculo => {
            const secao = document.createElement("section");
            const titulo = document.createElement("h3");
            const placa = document.createElement("p");
            const ano = document.createElement("p");
            const tipo = document.createElement("p");
            const proprietario = document.createElement("p");

            titulo.textContent = `${veiculo.marca} ${veiculo.modelo}`;
            placa.textContent = `Placa: ${veiculo.placa}`;
            ano.textContent = `Ano: ${veiculo.ano || "Não informado"}`;
            tipo.textContent = `Tipo: ${veiculo.tipo}`;
            proprietario.textContent = `Proprietário: ${veiculo.cliente_nome}`;

            const editar = document.createElement("button");
            editar.type = "button";
            editar.textContent = "Editar";
            editar.addEventListener("click", () => {
                prepararEdicao(veiculo.id);
            });

            const excluir = document.createElement("button");
            excluir.type = "button";
            excluir.textContent = "Excluir";
            excluir.addEventListener("click", () => {
                excluirVeiculo(veiculo.id);
            });

            secao.append(
                titulo,
                placa,
                ano,
                tipo,
                proprietario,
                editar,
                document.createTextNode(" "),
                excluir
            );

            lista.appendChild(secao);
        });

    } catch (erro) {
        lista.textContent = erro.message;
    }
}

// BUSCAR VEICULO NA API PARA EDITAR
async function prepararEdicao(id) {
    try {
        const resposta = await fetch(`${API_URL}/${id}`);

        if (!resposta.ok) {
            throw new Error("Não foi possível carregar o veículo.");
        }

        const veiculo = await resposta.json();

        veiculoEmEdicao = id;

        document.getElementById("cliente_id").value = veiculo.cliente_id;
        document.getElementById("placa").value = veiculo.placa;
        document.getElementById("marca").value = veiculo.marca;
        document.getElementById("modelo").value = veiculo.modelo;
        document.getElementById("ano").value = veiculo.ano || "";
        document.getElementById("tipo").value = veiculo.tipo;

        tituloFormulario.textContent = "Editar Veículo";
        botaoSalvar.textContent = "Salvar Alterações";
        botaoCancelar.hidden = false;

        mostrarMensagem("Editando veículo ID: " + id);

        formulario.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } catch (erro) {
        mostrarMensagem(erro.message);
    }
}

// CADASTRAR OU ATUALIZAR VEICULO
formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    const dados = {
        cliente_id: Number(document.getElementById("cliente_id").value),
        placa: document.getElementById("placa").value.trim(),
        marca: document.getElementById("marca").value.trim(),
        modelo: document.getElementById("modelo").value.trim(),
        ano: document.getElementById("ano").value || null,
        tipo: document.getElementById("tipo").value
    };

    const editando = veiculoEmEdicao !== null;

    try {
        const resposta = await fetch(
            editando ? `${API_URL}/${veiculoEmEdicao}` : API_URL,
            {
                method: editando ? "PUT" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            }
        );

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || "Erro ao salvar veículo.");
        }

        mostrarMensagem(
            editando
                ? "Veículo atualizado com sucesso!"
                : "Veículo cadastrado com sucesso!"
        );

        limparFormulario();
        await carregarVeiculos();

    } catch (erro) {
        mostrarMensagem(erro.message);
    }
});

// CANCELAR EDICAO
botaoCancelar.addEventListener("click", () => {
    limparFormulario();
    mostrarMensagem("Edição cancelada.");
});

// EXCLUIR VEICULO PELA API
async function excluirVeiculo(id) {
    if (!confirm("Tem certeza que deseja excluir este veículo?")) {
        return;
    }

    try {
        const resposta = await fetch(`${API_URL}/${id}`, {
            method: "DELETE"
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || "Erro ao excluir veículo.");
        }

        mostrarMensagem("Veículo excluído com sucesso!");

        if (veiculoEmEdicao === id) {
            limparFormulario();
        }

        await carregarVeiculos();

    } catch (erro) {
        mostrarMensagem(erro.message);
    }
}

// CARREGAR VEICULOS AO ABRIR A PAGINA
carregarVeiculos();
</script>

</body>
</html>
